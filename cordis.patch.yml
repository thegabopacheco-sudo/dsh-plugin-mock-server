# dsh-plugin-mock-server — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "mockserver".
# Tools resultantes: mcp__mockserver__* (ver README).
- insert:
    - id: mcp-mock-server
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mockserver
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/mock-server/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
